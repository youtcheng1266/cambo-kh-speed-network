<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Network | cambo-kh.com</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #020406;
            --app-bar: #0d1117;
            --card: rgba(255, 255, 255, 0.03);
            --accent: #00d4ff;
            --upload: #00ffaa;
            --ping: #ffcc00;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f6fc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* បំបាត់ពណ៌ពេលចុចលើទូរសព្ទ */
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        /* Android App Bar */
        .app-bar {
            background-color: var(--app-bar);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Install Button in App Bar */
        .btn-install {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            display: none; /* លាក់បណ្ដោះអាសន្ន */
            align-items: center;
            gap: 6px;
        }

        .btn-install:active {
            transform: scale(0.95);
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        .card-stat {
            background: rgba(0,0,0,0.3); 
            padding: 15px;
            border-radius: 15px; 
            border: 1px solid var(--border); 
            text-align: center;
        }

        .speed-val { font-family: 'JetBrains Mono'; font-size: 28px; font-weight: 800; display: block; margin: 5px 0;}
        .label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
        .unit { font-size: 10px; opacity: 0.5; }

        .sub-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        /* Big Floating Run Button */
        .btn-run {
            width: 100%; 
            background: linear-gradient(135deg, var(--accent), #0077ff); 
            color: #fff; 
            border: none; 
            padding: 18px;
            border-radius: 20px; 
            font-size: 16px;
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-run:active { transform: scale(0.98); }
        .btn-run:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .history-header h2 { font-size: 15px; margin: 0; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 5px; border-bottom: 1px solid var(--border); color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase;}
        td { padding: 12px 5px; border-bottom: 1px solid rgba(255,255,255,0.02); font-family: 'JetBrains Mono'; }
        
        .c-down { color: var(--accent); }
        .c-up { color: var(--upload); }
        .empty-msg { text-align: center; color: #484f58; padding: 20px; font-size: 13px;}

        .progress-line { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 20px; display: none; overflow: hidden; }
        .bar { width: 0%; height: 100%; background: var(--accent); transition: 0.3s; }
    </style>
</head>
<body>

    <nav class="app-bar">
        <div class="app-title">
            <i class="fas fa-network-wired" style="color: var(--accent); font-size: 20px;"></i>
            Speed Network
        </div>
        <button class="btn-install" id="installBtn">
            <i class="fas fa-download"></i> Get App
        </button>
    </nav>

    <div class="content">
        
        <div class="card-container">
            <div class="grid">
                <div class="card-stat">
                    <span class="label"><i class="fas fa-arrow-down" style="color:var(--accent)"></i> Down</span>
                    <span class="speed-val" id="down" style="color: var(--accent);">0.0</span>
                    <span class="unit">Mbps</span>
                </div>
                <div class="card-stat">
                    <span class="label"><i class="fas fa-arrow-up" style="color:var(--upload)"></i> Up</span>
                    <span class="speed-val" id="up" style="color: var(--upload);">0.0</span>
                    <span class="unit">Mbps</span>
                </div>
            </div>

            <div class="sub-grid">
                <div style="text-align: center; border-right: 1px solid var(--border);">
                    <span class="label">Ping</span>
                    <div style="color: var(--ping); font-family: 'JetBrains Mono'; font-size: 16px; margin-top: 5px;"><span id="ping">--</span> <span class="unit">ms</span></div>
                </div>
                <div style="text-align: center;">
                    <span class="label">Jitter</span>
                    <div style="color: var(--ping); font-family: 'JetBrains Mono'; font-size: 16px; margin-top: 5px;"><span id="jitter">--</span> <span class="unit">ms</span></div>
                </div>
            </div>

            <button class="btn-run" id="btn" onclick="startTest()">
                <i class="fas fa-play"></i> START TEST
            </button>

            <div class="progress-line" id="pLine"><div class="bar" id="pBar"></div></div>
        </div>

        <div class="card-container">
            <div class="history-header">
                <h2><i class="fas fa-history"></i> History</h2>
                <button onclick="clearHistory()" style="background:none; border:none; color:#da3633; cursor:pointer; font-size:12px; font-weight: 600;">CLEAR</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Down</th>
                        <th>Up</th>
                        <th>Ping</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                </tbody>
            </table>
            <div id="emptyMsg" class="empty-msg">No recent activity.</div>
        </div>

    </div>

    <script>
        // --- កូដ Speed Test ដដែល ---
        let history = [];

        async function startTest() {
            const btn = document.getElementById('btn');
            const pBar = document.getElementById('pBar');
            const pLine = document.getElementById('pLine');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> TESTING...';
            pLine.style.display = 'block';
            pBar.style.width = '0%';

            try {
                // 1. Ping & Jitter
                let pings = [];
                for(let i=0; i<4; i++) {
                    const s = Date.now();
                    await fetch('https://icanhazip.com/?t=' + s, { mode: 'no-cors' });
                    pings.push(Date.now() - s);
                    pBar.style.width = (i * 10) + '%';
                }
                const resPing = Math.floor(pings.reduce((a,b)=>a+b)/pings.length);
                const resJitter = Math.max(...pings) - Math.min(...pings);
                document.getElementById('ping').innerText = resPing;
                document.getElementById('jitter').innerText = resJitter;

                // 2. Download
                pBar.style.background = 'var(--accent)';
                const dUrl = "https://upload.wikimedia.org/wikipedia/commons/4/4e/Pleiades_large.jpg?cache=" + Date.now();
                const dStart = Date.now();
                const dRes = await fetch(dUrl);
                const dBlob = await dRes.blob();
                const resDown = ((dBlob.size * 8) / ((Date.now() - dStart) / 1000) / (1024 * 1024)).toFixed(1);
                document.getElementById('down').innerText = resDown;
                pBar.style.width = '70%';

                // 3. Upload
                pBar.style.background = 'var(--upload)';
                const uData = new Uint8Array(1000000); // 1MB
                const uStart = Date.now();
                await fetch('https://httpbin.org/post', { method: 'POST', body: uData });
                const resUp = ((uData.length * 8) / ((Date.now() - uStart) / 1000) / (1024 * 1024)).toFixed(1);
                document.getElementById('up').innerText = resUp;
                pBar.style.width = '100%';

                // Add to History
                addToHistory(resDown, resUp, resPing);

            } catch (e) {
                alert("Connection failed. Please check your internet.");
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-play"></i> START TEST';
            pLine.style.display = 'none';
        }

        function addToHistory(down, up, ping) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            
            const entry = { time: timeStr, down, up, ping };
            history.unshift(entry);
            if(history.length > 5) history.pop();

            renderHistory();
        }

        function renderHistory() {
            const body = document.getElementById('historyBody');
            const msg = document.getElementById('emptyMsg');
            
            if(history.length > 0) msg.style.display = 'none';
            
            body.innerHTML = history.map(h => `
                <tr>
                    <td style="color:#8b949e;">${h.time}</td>
                    <td class="c-down">${h.down}</td>
                    <td class="c-up">${h.up}</td>
                    <td style="color:var(--ping)">${h.ping}</td>
                </tr>
            `).join('');
        }

        function clearHistory() {
            history = [];
            document.getElementById('historyBody').innerHTML = '';
            document.getElementById('emptyMsg').style.display = 'block';
        }

        // --- កូដ PWA ដដែល ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Registered!', reg))
                .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt !== null) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA was installed');
        });
    </script>
</body>
</html>
